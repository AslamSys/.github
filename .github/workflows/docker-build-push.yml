# Workflow reutilizável de build e push para Docker Hub (renaneunao)
#
# Repo: AslamSys/.github
# Path: .github/workflows/docker-build-push.yml
#
# Uso em qualquer repo da org (trocar só image_name):
#
#   jobs:
#     docker:
#       uses: AslamSys/.github/.github/workflows/docker-build-push.yml@main
#       with:
#         image_name: mordomo-brain
#       secrets: inherit

name: Docker Build & Push

# ─── Interface pública ──────────────────────────────────────────────────────
on:
  workflow_call:
    inputs:
      image_name:
        description: "Nome da imagem (ex: mordomo-brain) — publicado em renaneunao/{image_name}"
        required: true
        type: string
      context:
        description: "Contexto do build (relativo à raiz do repo)"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile relativo ao contexto"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Plataformas alvo"
        required: false
        type: string
        default: "linux/arm64"
    secrets:
      DOCKERHUB_TOKEN:
        required: true

# ─── Job ────────────────────────────────────────────────────────────────────
jobs:
  build-and-push:
    name: Build & Push ${{ inputs.image_name }}
    runs-on: ubuntu-latest

    steps:

      # ── 1. Código ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Ambiente de build ───────────────────────────────────────────────
      - name: Setup QEMU (cross-compile ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ inputs.platforms }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ── 3. Autenticação ────────────────────────────────────────────────────
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: renaneunao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Metadados ───────────────────────────────────────────────────────
      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: renaneunao/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── 5. Build & Push ────────────────────────────────────────────────────
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # desativa attestation manifest (evita push extra)
          sbom: false         # desativa SBOM manifest (evita push extra)
          cache-from: type=gha
          cache-to: type=gha,mode=max
