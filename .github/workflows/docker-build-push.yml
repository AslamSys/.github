# Workflow reutilizável — Docker Build & Push
#
# Este arquivo pertence ao repo AslamSys/.github
# Caminho esperado: .github/workflows/docker-build-push.yml
#
# Uso em qualquer repo da org:
#
#   jobs:
#     docker:
#       uses: AslamSys/.github/.github/workflows/docker-build-push.yml@main
#       with:
#         image_name: nome-da-imagem
#       secrets: inherit
#
# Secret necessário no repo (ou na org): DOCKERHUB_TOKEN
# Imagens publicadas em: docker.io/renaneunao/{image_name}

name: Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nome da imagem sem registry/namespace (ex: mordomo-brain)"
        required: true
        type: string
      context:
        description: "Diretório de contexto do build (relativo à raiz do repo)"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile relativo ao contexto"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Plataformas alvo (padrão: linux/arm64 para Orange Pi)"
        required: false
        type: string
        default: "linux/arm64"
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.image_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-build ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ inputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: renaneunao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: renaneunao/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
